# Pages CMS Konfiguration — https://pagescms.org
# Definiert, welche Inhalte der Kunde über die CMS-Oberfläche bearbeiten kann.

media:
  input: assets/uploads
  output: /assets/uploads
  categories: [image]
  rename: safe

settings:
  content:
    # Beim Speichern nicht im Schema enthaltene Keys (z. B. layout/permalink im
    # Front Matter) erhalten statt löschen — Schutz vor stillem Datenverlust.
    merge: true

content:
  # --- Anleitung für Kunden — nur Ansicht (readonly), immer ganz oben ---
  - name: anleitung
    label: "📖 Erste Schritte"
    type: file
    path: ANLEITUNG.md
    operations:
      delete: false
    fields:
      - name: body
        label: false
        type: rich-text
        readonly: true
        options:
          switcher: false
          media: false

  # --- Webseiten-Einstellungen (_data/settings.yml) ---
  - name: settings
    label: "⚙️ Webseiten-Einstellungen"
    type: file
    path: _data/settings.yml
    operations:
      delete: false
    fields:
      - name: firma
        label: "Firma"
        type: object
        fields:
          - name: name
            label: "Firmenname"
            type: string
            required: true
          - name: slogan
            label: "Slogan"
            type: string
          - name: telefon
            label: "Telefon"
            type: string
            required: true
          - name: email
            label: "E-Mail-Adresse"
            type: string
            required: true
            pattern:
              regex: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
              message: "Bitte eine gültige E-Mail-Adresse angeben, z. B. info@firma.de"
          - name: strasse
            label: "Straße und Hausnummer"
            type: string
            required: true
          - name: plz
            label: "Postleitzahl"
            type: string
            required: true
            pattern:
              regex: '^[0-9]{5}$'
              message: "Bitte genau 5 Ziffern angeben, z. B. 10115"
          - name: ort
            label: "Ort"
            type: string
            required: true
      - name: farbe_primaer
        label: "Primärfarbe (Hex-Code)"
        type: string
        required: true
        description: "z. B. #1a5faa"
        pattern:
          regex: '^#[0-9A-Fa-f]{6}$'
          message: "Bitte als Hex-Code mit # und 6 Stellen angeben, z. B. #1a5faa"
      - name: design_ecken
        label: "Formensprache"
        type: select
        default: abgerundet
        description: "Wirkt auf Karten und Buttons der gesamten Website."
        options:
          values:
            - name: abgerundet
              label: "Sanft abgerundet"
            - name: eckig
              label: "Klassisch eckig"
      - name: google_bewertung_url
        label: "Link zu Google-Bewertungen (optional)"
        type: string
        required: false
        description: "Vollständige Adresse mit https:// — leer lassen, um den Bewertungs-Button auszublenden."
      - name: oeffnungszeiten
        label: "Öffnungszeiten"
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{tag}: {zeit}"
        fields:
          - name: tag
            label: "Tag(e)"
            type: string
            required: true
          - name: zeit
            label: "Uhrzeit"
            type: string
            required: true
      - name: leistungen
        label: "Leistungen"
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{titel}"
        fields:
          - name: titel
            label: "Titel"
            type: string
            required: true
          - name: beschreibung
            label: "Beschreibung"
            type: text
            required: true
          - name: preis
            label: "Preis (optional)"
            type: string
            required: false
      - name: ueber_uns
        label: "Über-uns-Text"
        type: text
        required: true

  # --- Navigation (_data/navigation.yml) ---
  - name: navigation
    label: "🧭 Navigation"
    type: file
    path: _data/navigation.yml
    list: true
    operations:
      delete: false
    fields:
      - name: nav_label
        label: "Bezeichnung"
        type: string
        required: true
      - name: url
        label: "Ziel-URL"
        type: string
        required: true
        description: "z. B. / oder /#kontakt oder /aktuelles/"
      - name: nav_order
        label: "Reihenfolge"
        type: number
        required: true
      - name: visible
        label: "Sichtbar"
        type: boolean
        default: true
      - name: requires_posts
        label: "Nur anzeigen, wenn Blogbeiträge existieren"
        type: boolean
        default: false

  # --- Unterseiten, z. B. Impressum/Datenschutz (_pages/) ---
  - name: pages
    label: "📄 Unterseiten"
    type: collection
    path: _pages
    filename:
      template: "{title}.md"
      field: false
    operations:
      rename: false
    view:
      fields: [title, published]
      primary: title
      sort: [nav_order, title]
      default:
        sort: nav_order
        order: asc
    fields:
      - name: title
        label: "Titel"
        type: string
        required: true
      - name: nav_label
        label: "Bezeichnung in der Navigation"
        type: string
        required: true
      - name: nav_order
        label: "Reihenfolge in der Navigation"
        type: number
        default: 50
      - name: nav_location
        label: "Anzeigeort"
        type: select
        options:
          values:
            - name: header
              label: "Hauptnavigation"
            - name: footer
              label: "Footer"
        default: footer
      - name: published
        label: "Veröffentlicht"
        type: boolean
        default: true
      - name: noindex
        label: "Von Google ausschließen (z. B. Impressum/Datenschutz)"
        type: boolean
        default: false
      - name: sitemap
        label: "In Sitemap aufnehmen"
        type: boolean
        default: true
      - name: body
        label: "Inhalt"
        type: rich-text
        options:
          switcher: false

  # --- Blog (_posts/) ---
  - name: posts
    label: "📰 Aktuelles (Blog)"
    type: collection
    path: _posts
    filename:
      template: "{year}-{month}-{day}-{fields.title}.md"
      field: false
    view:
      fields: [image, title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: "Titel"
        type: string
        required: true
      - name: date
        label: "Datum"
        type: date
        required: true
      - name: image
        label: "Aufmacherbild"
        type: image
        required: false
      - name: body
        label: "Text"
        type: rich-text
        options:
          switcher: false
